<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>COCORO-KOBO</title>
<style>
  /* 2026-10-01: 短縮URLの転送ページ。 ?Ab3x9Z を社内GASに問い合わせて元のURLへ移動する */
  :root { --bg:#000; --fg:#f2f2f2; --mute:#8a8a8a; --accent:#d5001c; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
  body { display:flex; align-items:center; justify-content:center; font-family:"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; font-weight:300; }
  .box { text-align:center; padding:24px; max-width:360px; }
  .logo { font-size:13px; letter-spacing:.32em; color:var(--mute); margin-bottom:28px; }
  .bar { width:120px; height:2px; margin:0 auto 20px; background:#222; overflow:hidden; position:relative; }
  .bar::after { content:""; position:absolute; left:-40%; width:40%; height:100%; background:var(--accent); animation:run 1.1s ease-in-out infinite; }
  @keyframes run { to { left:100%; } }
  .msg { font-size:14px; line-height:1.8; }
  .msg small { display:block; color:var(--mute); font-size:12px; margin-top:8px; }
  .err .bar { display:none; }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="logo">COCORO-KOBO</div>
  <div class="bar"></div>
  <div class="msg" id="msg">ページを開いています…</div>
</div>
<script>
(function(){
  var GAS = 'https://script.google.com/macros/s/AKfycby8Yz78JtNQlS615qq44QhQ0qEKjOL9An_qn6DelmN16Mm16VlTfF8kjfcl0nrJA788LQ/exec';
  var box = document.getElementById('box'), msg = document.getElementById('msg');
  function fail(text){
    box.className = 'box err';
    msg.innerHTML = '';
    msg.appendChild(document.createTextNode(text));
    var s = document.createElement('small');
    s.textContent = 'お手数ですが、ご案内したメールまたはLINEのURLをもう一度お確かめください。';
    msg.appendChild(s);
  }
  // 自社のページ以外へは移動しない（短縮URLを他所への転送に悪用させない）
  function allowed(u){
    return typeof u === 'string' && (u.indexOf('https://802eve.github.io/cocoro-3d-viewer/') === 0 || u.indexOf(GAS) === 0);
  }
  var q = location.search.replace(/^\?/, '');
  var key = (/(^|&)k=([^&]*)/.exec(q) || [])[2] || q.split('&')[0];
  key = (key || '').replace(/[^A-Za-z0-9]/g, '');
  if (!key) { fail('URLが正しくありません。'); return; }
  var done = false;
  var timer = setTimeout(function(){ if (!done) fail('読み込みに時間がかかっています。通信環境をご確認ください。'); }, 20000);
  window.__cocoroShort = function(res){
    done = true; clearTimeout(timer);
    var u = res && res.url;
    if (u && allowed(u)) { location.replace(u); return; }
    fail('このURLは見つかりませんでした。');
  };
  var sc = document.createElement('script');
  sc.src = GAS + '?action=shortResolve&k=' + encodeURIComponent(key) + '&callback=__cocoroShort';
  sc.onerror = function(){ if (!done) { done = true; clearTimeout(timer); fail('読み込みに失敗しました。'); } };
  document.head.appendChild(sc);
})();
</script>
</body>
</html>
